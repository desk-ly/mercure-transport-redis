name: Security

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build FrankenPHP with this transport
        run: |
          docker build -f - -o type=local,dest=binary . <<'EOF'
          FROM dunglas/frankenphp:1.13.1-builder-php8.5.12-alpine AS builder

          COPY --from=caddy:builder /usr/bin/xcaddy /usr/bin/xcaddy
          COPY . /transport

          RUN CGO_ENABLED=1 \
              XCADDY_GO_BUILD_FLAGS="-ldflags='-w -s' -tags=nobadger,nomysql,nopgx" \
              CGO_CFLAGS=$(php-config --includes) \
              CGO_LDFLAGS="$(php-config --ldflags) $(php-config --libs)" \
              xcaddy build \
                  --output /frankenphp \
                  --with github.com/dunglas/frankenphp=./ \
                  --with github.com/dunglas/frankenphp/caddy=./caddy/ \
                  --with github.com/desk-ly/mercure-transport-redis=/transport

          FROM scratch
          COPY --from=builder /frankenphp /frankenphp
          EOF

      # Reports Go dependencies of the whole binary, including those coming from
      # FrankenPHP, Caddy and Mercure, which govulncheck above does not cover.
      - name: Scan the binary
        run: |
          docker run --rm -v "$PWD":/repo -w /repo aquasec/trivy:latest \
            rootfs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress binary
